out_dir: 'out/crystallm_ultra_v1_N2n4'
eval_interval: 250  # how often to evaluate against the validation set
eval_iters_train: 200
log_interval: 1  # how often to print to the console (1 = every iteration)
# init_from: "resume"
# whether to always save a checkpoint
always_save_checkpoint: False

# whether to validate with a validation set
validate: True

dataset: 'out/tokens_full_train_val'
batch_size: 8 #16
block_size: 2048 #1024

n_layer: 20
n_head: 32
n_embd: 2048
dropout: 0.1

learning_rate: 1e-4 #-4
max_iters: 40000 #40,000
lr_decay_iters: 40000 #40,000
min_lr: 1e-5 #-5
beta2: 0.99

warmup_iters: 1000 
